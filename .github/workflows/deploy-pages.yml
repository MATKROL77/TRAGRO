name: Deploy a Cloudflare

on:
  push:
    branches: [main, claude/focused-babbage-97zile]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # los secretos están cargados en este Environment del repo
    environment: Configure api token
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy (Cloudflare Workers + KV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ea060ae701e304a6d55624287327abdd
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Sin CLOUDFLARE_API_TOKEN: se omite el deploy"; exit 0; fi
          python3 deploy/deploy-worker.py
