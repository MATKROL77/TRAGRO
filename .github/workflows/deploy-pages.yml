name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main, claude/focused-babbage-97zile]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # los secretos están cargados en este Environment del repo
    environment: Configure api token
    permissions:
      contents: read
      deployments: write
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name surco-configurador --branch main
